    // ────────────────────────────────────────────────────────────────
    // Language Management
    // ────────────────────────────────────────────────────────────────

    class GroomQuestLanguageManager {
        constructor() {
            this.currentLang = 'en';
            this.navTranslations = {
                en: {
                    prologue: "Prologue",
                    quests: "Quests",
                    ceremony: "Ceremony",
                    travel: "Travel",
                    rsvp: "RSVP"
                },
                ru: {
                    prologue: "Пролог",
                    quests: "Квесты",
                    ceremony: "Церемония",
                    travel: "Путешествие",
                    rsvp: "RSVP"
                },
                he: {
                    prologue: "פרולוג",
                    quests: "חידות",
                    ceremony: "טקס",
                    travel: "נסיעה",
                    rsvp: "אישור הגעה"
                }
            };
            this.init();
        }

        init() {
            // Check multiple sources for language preference
            const urlLang = new URLSearchParams(window.location.search).get('lang');
            const savedLang = sessionStorage.getItem('wedding-language');
            const localLang = localStorage.getItem('wedding-language');

            console.log('Groom Quest language detection:', { urlLang, savedLang, localLang });

            // Priority: URL parameter > sessionStorage > localStorage > default
            if (urlLang && ['en', 'he', 'ru'].includes(urlLang)) {
                this.currentLang = urlLang;
            } else if (savedLang && ['en', 'he', 'ru'].includes(savedLang)) {
                this.currentLang = savedLang;
            } else if (localLang && ['en', 'he', 'ru'].includes(localLang)) {
                this.currentLang = localLang;
            }

            this.applyLanguage();
            this.setupLanguageObserver();
            this.setupNavbarEvents();
            console.log('Groom Quest initialized with language:', this.currentLang);
        }

        applyLanguage() {
            const html = document.documentElement;
            const body = document.body;

            // Set language and direction
            html.lang = this.currentLang;

            if (this.currentLang === 'he') {
                html.dir = 'rtl';
                body.style.direction = 'rtl';
            } else {
                html.dir = 'ltr';
                body.style.direction = 'ltr';
            }

            // Update page title
            const titles = {
                en: 'D & V — His Quest',
                he: 'ד & ו — המסע שלו',
                ru: 'Д & В — Его Квест'
            };
            document.title = titles[this.currentLang] || titles.en;

            // Update navbar translations
            this.updateNavbar();

            // Re-render current scene with new language
            if (window.scenes && typeof window.render === 'function') {
                window.render();
            }
        }

        updateNavbar() {
            const lang = this.currentLang;
            const t = this.navTranslations[lang];

            // Update all navigation elements
            document.querySelectorAll('[data-nav-key]').forEach(element => {
                const key = element.getAttribute('data-nav-key');
                if (t[key]) {
                    element.textContent = t[key];
                }
            });
        }

        setupNavbarEvents() {
            // Setup burger menu functionality
            const burger = document.getElementById('burger');
            const mobileMenu = document.getElementById('mobileMenu');

            if (burger && mobileMenu) {
                burger.addEventListener('click', function() {
                    burger.classList.toggle('active');
                    mobileMenu.classList.toggle('visible');
                });

                // Close menu when clicking a link
                mobileMenu.querySelectorAll('a').forEach(a => {
                    a.addEventListener('click', function() {
                        burger.classList.remove('active');
                        mobileMenu.classList.remove('visible');
                    });
                });

                // Close menu when clicking outside
                document.addEventListener('click', function(e) {
                    if (mobileMenu.classList.contains('visible') &&
                        !mobileMenu.contains(e.target) &&
                        !burger.contains(e.target)) {
                        burger.classList.remove('active');
                        mobileMenu.classList.remove('visible');
                    }
                });
            }
        }

        setupLanguageObserver() {
            // Poll for sessionStorage changes
            let lastSessionLang = sessionStorage.getItem('wedding-language');
            setInterval(() => {
                const currentSessionLang = sessionStorage.getItem('wedding-language');
                if (currentSessionLang && currentSessionLang !== lastSessionLang && currentSessionLang !== this.currentLang) {
                    console.log('Groom Quest detected language change:', currentSessionLang);
                    this.setLanguage(currentSessionLang);
                    lastSessionLang = currentSessionLang;
                }
            }, 1000);

            // Listen for storage changes
            window.addEventListener('storage', (event) => {
                if (event.key === 'wedding-language' && event.newValue) {
                    this.setLanguage(event.newValue);
                }
            });
        }

        setLanguage(lang) {
            if (['en', 'he', 'ru'].includes(lang) && lang !== this.currentLang) {
                this.currentLang = lang;
                this.applyLanguage();
            }
        }

        getCurrentLanguage() {
            return this.currentLang;
        }
    }

    // Generate localized scenes
    function getLocalizedScenes() {
        const lang = langManager.getCurrentLanguage();
        const t = translations[lang];

        return baseScenes.map((scene, index) => {
            const localizedContent = t.scenes[index];
            return {
                ...scene,
                speaker: t.vlad,
                text: localizedContent.text,
                choices: localizedContent.choices.map((choice, choiceIndex) => ({
                    text: choice.text,
                    action: () => {
                        if (index < baseScenes.length - 1) {
                            goto(index + 1);
                        } else {
                            startCombat();
                        }
                    }
                }))
            };
        });
    }

    // ── STATE ───────────────────────────────────────────────────────
    let idx = 0;
    let scenes = getLocalizedScenes();

    // Update scenes when language changes
    langManager.originalSetLanguage = langManager.setLanguage;
    langManager.setLanguage = function(lang) {
        langManager.originalSetLanguage.call(this, lang);
        scenes = getLocalizedScenes();
        render(); // Re-render current scene
    };

    // ── DOM HOOKS ───────────────────────────────────────────────────
    const sceneEl          = document.getElementById('scene');
    const vladEl           = document.getElementById('vlad');
    const diaEl            = document.getElementById('dialogue');
    const textEl           = document.getElementById('dialogue-text');
    const labelEl          = document.getElementById('dialogue-label');
    const chEl             = document.getElementById('choices');
    const combatIframe     = document.getElementById('combat-iframe');

    // ── RENDER LOOP ─────────────────────────────────────────────────
    function render() {
        const s = scenes[idx];

        sceneEl.style.backgroundImage = `url('${s.bg}')`;

        if (s.char) {
            vladEl.src = s.char;
            vladEl.classList.remove('hidden');
        } else {
            vladEl.classList.add('hidden');
        }

        if (s.text !== undefined) {
            diaEl.classList.remove('hidden');
            labelEl.textContent = s.speaker || '';
            textEl.textContent  = s.text;
            chEl.innerHTML      = '';

            (s.choices || []).forEach(c => {
                const btn = document.createElement('span');
                btn.textContent = c.text;
                btn.className   = 'choice';
                btn.onclick     = c.action;
                chEl.appendChild(btn);
            });
        } else {
            diaEl.classList.add('hidden');
        }
    }

    // ── HELPER NAV FUNCTIONS ────────────────────────────────────────
    function goto(i) {
        idx = i;
        render();
    }

    // ── COMBAT TRANSITION ───────────────────────────────────────────
    function startCombat() {
        const lang = langManager.getCurrentLanguage();
        const t = translations[lang];

        labelEl.textContent = t.vlad;
        textEl.textContent = t.combatTransition.initial;

        document.querySelectorAll('.choice').forEach(btn => {
            btn.style.pointerEvents = 'none';
            btn.style.opacity = '0.5';
        });

        setTimeout(() => {
            textEl.textContent = t.combatTransition.tracking;
            setTimeout(() => {
                window.location.href = 'GroomQuest/index.html';
            }, 1500);
        }, 3000);
    }

    // Make functions globally available
    window.scenes = scenes;
    window.render = render;
    window.goto = goto;
    window.startCombat = startCombat;

    // ── START ───────────────────────────────────────────────────────
    render();
</script>
